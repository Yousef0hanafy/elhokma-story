name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Static checks + unit tests. No browser needed.
  lint:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Validate HTML
        run: npm run lint:html

      - name: Check packaging consistency
        run: npm run check:files

      - name: Unit tests
        run: npm run test:unit

      - name: Forbid inline event handlers in HTML
        run: |
          if grep -nE '\son[a-z]+="' index.html; then
            echo "Inline event handlers violate the CSP (script-src 'self')."
            exit 1
          fi

  # Runs the real course in Chromium against a strict mock LMS.
  e2e:
    name: End-to-End (mock LMS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  # Builds the SCORM ZIP and keeps it as a downloadable artifact.
  package:
    name: SCORM Package
    runs-on: ubuntu-latest
    needs: [lint, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Build SCORM package
        run: ./scripts/build-scorm.sh

      - name: Upload SCORM package
        uses: actions/upload-artifact@v4
        with:
          name: elhokma-governance-scorm
          path: dist/elhokma-governance-scorm.zip
          if-no-files-found: error
